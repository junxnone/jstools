<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Markmap Blocks Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://markmap.js.org/favicon.png" rel="icon" type="image/png" />
    <style>
        html,
        body {
            margin: 0;
            font-family: -apple-system, Segoe UI, Arial, sans-serif;
            background-color: #fafafa;
        }

        #container {
            padding: 10px;
        }

        .markmap-panel {
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .markmap-title {
            padding: 6px 10px;
            font-size: 13px;
            color: #555;
            border-bottom: 1px solid #eee;
            background: #f5f5f5;
        }

        .markmap-wrap {
            position: relative;
            width: 100%;
            height: 70vh;
            background-color: RGB(227, 237, 205);
        }

        .markmap-wrap:fullscreen {
            height: 100vh;
        }

        .markmap-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .markmap-controls {
            position: absolute;
            right: 8px;
            bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 5;
        }

        .markmap-controls button {
            width: 28px;
            height: 28px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            color: #333;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
        }

        .markmap-controls button:hover {
            background: #f0f0f0;
        }

        .error {
            color: #c00;
            padding: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12"></script>
</head>

<body>
    <div id="container">Loading...</div>

    <script>
        const transformer = new markmap.Transformer();

        function extractMarkmapBlocks(md) {
            const re = /```markmap\s*\n([\s\S]*?)```/g;
            const blocks = [];
            let m;
            while ((m = re.exec(md)) !== null) {
                blocks.push(m[1].trim());
            }
            return blocks;
        }

        function blockTitle(block, index) {
            const fm = block.match(/^---\s*\n([\s\S]*?)\n---/);
            if (fm) {
                const t = fm[1].match(/^title:\s*(.+)$/m);
                if (t) return t[1].trim();
            }
            return "Markmap " + (index + 1);
        }

        function toggleFullscreen(wrap) {
            if (document.fullscreenElement === wrap) {
                document.exitFullscreen();
            } else {
                wrap.requestFullscreen();
            }
        }

        function addControls(wrap, mm) {
            const controls = document.createElement("div");
            controls.className = "markmap-controls";

            const reset = document.createElement("button");
            reset.title = "Reset";
            reset.innerText = "⟲";
            reset.onclick = () => mm.fit();

            const fullscreen = document.createElement("button");
            fullscreen.title = "Fullscreen";
            fullscreen.innerText = "⛶";
            fullscreen.onclick = () => toggleFullscreen(wrap);

            controls.appendChild(reset);
            controls.appendChild(fullscreen);
            wrap.appendChild(controls);

            wrap.addEventListener("fullscreenchange", () => {
                setTimeout(() => mm.fit(), 0);
            });
        }

        function renderBlocks(blocks) {
            const container = document.getElementById("container");
            container.innerHTML = "";
            if (blocks.length === 0) {
                container.innerHTML = "<p>No ```markmap``` code block found in the markdown.</p>";
                return;
            }
            blocks.forEach((block, i) => {
                const panel = document.createElement("div");
                panel.className = "markmap-panel";

                const title = document.createElement("div");
                title.className = "markmap-title";
                title.innerText = blockTitle(block, i);
                panel.appendChild(title);

                const wrap = document.createElement("div");
                wrap.className = "markmap-wrap";
                panel.appendChild(wrap);

                container.appendChild(panel);

                try {
                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    wrap.appendChild(svg);
                    const { root, frontmatter } = transformer.transform(block);
                    const options = markmap.deriveOptions(frontmatter && frontmatter.markmap);
                    const mm = markmap.Markmap.create(svg, options, root);
                    addControls(wrap, mm);
                } catch (e) {
                    const err = document.createElement("div");
                    err.className = "error";
                    err.innerText = "Render error: " + e.message;
                    wrap.appendChild(err);
                }
            });
        }

        async function loadMarkdown() {
            const url = new URL(document.location);
            if (url.searchParams.has("str")) {
                return url.searchParams.get("str");
            }
            let md = url.searchParams.get("md");
            if (!md) {
                md = "test.md";
            } else if (!md.endsWith(".md")) {
                md = md + ".md";
            }
            const reqUrl = new URL(md, document.location);
            const res = await fetch(new Request(reqUrl));
            return await res.text();
        }

        async function main() {
            const text = await loadMarkdown();
            const blocks = extractMarkmapBlocks(text);
            renderBlocks(blocks);
        }
        main().catch((e) => {
            document.getElementById("container").innerHTML =
                '<div class="error">Load error: ' + e.message + "</div>";
            console.error(e);
        });
    </script>
</body>

</html>
