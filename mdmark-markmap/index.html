<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Markmap Blocks Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://markmap.js.org/favicon.png" rel="icon" type="image/png" />
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, Segoe UI, Arial, sans-serif;
            background-color: #fafafa;
        }

        #tabbar {
            display: flex;
            height: 36px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            overflow-x: auto;
        }

        .tab-button {
            flex: none;
            padding: 0 14px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            border: none;
            border-right: 1px solid #ddd;
            background: #f5f5f5;
        }

        .tab-button:hover {
            background: #eee;
        }

        .tab-button.active {
            background: #fff;
            color: #111;
            font-weight: bold;
        }

        #panels {
            position: relative;
            width: 100%;
            height: calc(100% - 36px);
        }

        .markmap-wrap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: RGB(227, 237, 205);
            display: none;
        }

        .markmap-wrap.active {
            display: block;
        }

        .markmap-wrap:fullscreen {
            background-color: RGB(227, 237, 205);
        }

        .markmap-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .markmap-controls {
            position: absolute;
            right: 8px;
            bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 5;
        }

        .markmap-controls button {
            width: 28px;
            height: 28px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            color: #333;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
        }

        .markmap-controls button:hover {
            background: #f0f0f0;
        }

        .error {
            color: #c00;
            padding: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12"></script>
</head>

<body>
    <div id="tabbar"></div>
    <div id="panels">Loading...</div>

    <script>
        const transformer = new markmap.Transformer();
        const tabs = [];

        function extractMarkmapBlocks(md) {
            const re = /```markmap\s*\n([\s\S]*?)```/g;
            const blocks = [];
            let m;
            while ((m = re.exec(md)) !== null) {
                blocks.push(m[1].trim());
            }
            return blocks;
        }

        function blockTitle(block, index) {
            const fm = block.match(/^---\s*\n([\s\S]*?)\n---/);
            if (fm) {
                const t = fm[1].match(/^title:\s*(.+)$/m);
                if (t) return t[1].trim();
            }
            return "Markmap " + (index + 1);
        }

        function toggleFullscreen(wrap) {
            if (document.fullscreenElement === wrap) {
                document.exitFullscreen();
            } else {
                wrap.requestFullscreen();
            }
        }

        function addControls(wrap, mm) {
            const controls = document.createElement("div");
            controls.className = "markmap-controls";

            const reset = document.createElement("button");
            reset.title = "Reset";
            reset.innerText = "⟲";
            reset.onclick = () => mm.fit();

            const fullscreen = document.createElement("button");
            fullscreen.title = "Fullscreen";
            fullscreen.innerText = "⛶";
            fullscreen.onclick = () => toggleFullscreen(wrap);

            controls.appendChild(reset);
            controls.appendChild(fullscreen);
            wrap.appendChild(controls);

            wrap.addEventListener("fullscreenchange", () => {
                setTimeout(() => mm.fit(), 0);
            });
        }

        function activateTab(index) {
            tabs.forEach((tab, i) => {
                tab.btn.classList.toggle("active", i === index);
                tab.wrap.classList.toggle("active", i === index);
            });
            const tab = tabs[index];
            if (tab.mm) {
                tab.mm.fit();
                return;
            }
            try {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                tab.wrap.appendChild(svg);
                const { root, frontmatter } = transformer.transform(tab.block);
                const options = markmap.deriveOptions(frontmatter && frontmatter.markmap);
                tab.mm = markmap.Markmap.create(svg, options, root);
                addControls(tab.wrap, tab.mm);
                //the wrap just became visible (display:none -> block) in this same
                //tick, so the layout it needs to fit against may not exist yet when
                //create()'s own internal fit() runs; fit again once it settles
                setTimeout(() => tab.mm.fit(), 0);
            } catch (e) {
                const err = document.createElement("div");
                err.className = "error";
                err.innerText = "Render error: " + e.message;
                tab.wrap.appendChild(err);
            }
        }

        function renderBlocks(blocks) {
            const tabbar = document.getElementById("tabbar");
            const panels = document.getElementById("panels");
            tabbar.innerHTML = "";
            panels.innerHTML = "";
            if (blocks.length === 0) {
                panels.innerHTML = "<p style=\"padding:10px\">No ```markmap``` code block found in the markdown.</p>";
                return;
            }
            blocks.forEach((block, i) => {
                const btn = document.createElement("button");
                btn.className = "tab-button";
                btn.innerText = blockTitle(block, i);
                btn.onclick = () => activateTab(i);
                tabbar.appendChild(btn);

                const wrap = document.createElement("div");
                wrap.className = "markmap-wrap";
                panels.appendChild(wrap);

                tabs.push({ block, btn, wrap, mm: null });
            });
            activateTab(0);
        }

        async function loadMarkdown() {
            const url = new URL(document.location);
            if (url.searchParams.has("str")) {
                return url.searchParams.get("str");
            }
            let md = url.searchParams.get("md");
            if (!md) {
                md = "test.md";
            } else if (!md.endsWith(".md")) {
                md = md + ".md";
            }
            const reqUrl = new URL(md, document.location);
            const res = await fetch(new Request(reqUrl));
            return await res.text();
        }

        async function main() {
            const text = await loadMarkdown();
            const blocks = extractMarkmapBlocks(text);
            renderBlocks(blocks);
        }
        main().catch((e) => {
            document.getElementById("panels").innerHTML =
                '<div class="error">Load error: ' + e.message + "</div>";
            console.error(e);
        });
    </script>
</body>

</html>
