<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Mermaid Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, Segoe UI, Arial, sans-serif;
            background-color: #fafafa;
        }

        #tabbar {
            display: flex;
            height: 36px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            overflow-x: auto;
        }

        .tab-button {
            flex: none;
            padding: 0 14px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            border: none;
            border-right: 1px solid #ddd;
            background: #f5f5f5;
        }

        .tab-button:hover {
            background: #eee;
        }

        .tab-button.active {
            background: #fff;
            color: #111;
            font-weight: bold;
        }

        #panels {
            position: relative;
            width: 100%;
            height: calc(100% - 36px);
        }

        .diagram-wrap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: none;
        }

        .diagram-wrap.active {
            display: block;
        }

        .diagram-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .diagram-controls {
            position: absolute;
            right: 8px;
            bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 5;
        }

        .diagram-controls button {
            width: 28px;
            height: 28px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            color: #333;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
        }

        .diagram-controls button:hover {
            background: #f0f0f0;
        }

        .error {
            color: #c00;
            padding: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom/dist/svg-pan-zoom.min.js"></script>
</head>

<body>
    <div id="tabbar"></div>
    <div id="panels">Loading...</div>

    <script>
        mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });
        const tabs = [];

        function toggleFullscreen(wrap) {
            if (document.fullscreenElement === wrap) {
                document.exitFullscreen();
            } else {
                wrap.requestFullscreen();
            }
        }

        function addControls(wrap, panZoom) {
            const controls = document.createElement("div");
            controls.className = "diagram-controls";

            const zoomIn = document.createElement("button");
            zoomIn.title = "Zoom in";
            zoomIn.innerText = "+";
            zoomIn.onclick = () => panZoom.zoomIn();

            const zoomOut = document.createElement("button");
            zoomOut.title = "Zoom out";
            zoomOut.innerText = "−";
            zoomOut.onclick = () => panZoom.zoomOut();

            const reset = document.createElement("button");
            reset.title = "Reset";
            reset.innerText = "⟲";
            reset.onclick = () => {
                panZoom.resetZoom();
                panZoom.resetPan();
            };

            const fullscreen = document.createElement("button");
            fullscreen.title = "Fullscreen";
            fullscreen.innerText = "⛶";
            fullscreen.onclick = () => toggleFullscreen(wrap);

            controls.appendChild(zoomIn);
            controls.appendChild(zoomOut);
            controls.appendChild(reset);
            controls.appendChild(fullscreen);
            wrap.appendChild(controls);

            wrap.addEventListener("fullscreenchange", () => {
                setTimeout(() => {
                    panZoom.resize();
                    panZoom.fit();
                    panZoom.center();
                }, 0);
            });
        }

        function extractMermaidBlocks(md) {
            const re = /```mermaid\s*\n([\s\S]*?)```/g;
            const blocks = [];
            let m;
            while ((m = re.exec(md)) !== null) {
                blocks.push(m[1].trim());
            }
            return blocks;
        }

        async function activateTab(index) {
            tabs.forEach((tab, i) => {
                tab.btn.classList.toggle("active", i === index);
                tab.wrap.classList.toggle("active", i === index);
            });
            const tab = tabs[index];
            if (tab.panZoom) {
                //the wrap may have been hidden (display:none) since this was last
                //sized, or the window may have resized while it was hidden
                setTimeout(() => {
                    tab.panZoom.resize();
                    tab.panZoom.fit();
                    tab.panZoom.center();
                }, 0);
                return;
            }
            try {
                const { svg } = await mermaid.render("mmd-" + index, tab.block);
                tab.wrap.innerHTML = svg;
                const svgEl = tab.wrap.querySelector("svg");
                svgEl.removeAttribute("height");
                svgEl.style.maxWidth = "none";
                tab.panZoom = svgPanZoom(svgEl, {
                    zoomEnabled: true,
                    controlIconsEnabled: false,
                    fit: true,
                    center: true,
                    minZoom: 0.2,
                    maxZoom: 20
                });
                addControls(tab.wrap, tab.panZoom);
                //the wrap just became visible (display:none -> block) in this same
                //tick, so the layout it needs to fit against may not exist yet when
                //svgPanZoom's own initial fit runs; fit again once it settles
                setTimeout(() => {
                    tab.panZoom.resize();
                    tab.panZoom.fit();
                    tab.panZoom.center();
                }, 0);
            } catch (e) {
                const err = document.createElement("div");
                err.className = "error";
                err.innerText = "Render error: " + e.message;
                tab.wrap.appendChild(err);
            }
        }

        function renderDiagrams(blocks) {
            const tabbar = document.getElementById("tabbar");
            const panels = document.getElementById("panels");
            tabbar.innerHTML = "";
            panels.innerHTML = "";
            if (blocks.length === 0) {
                panels.innerHTML = "<p style=\"padding:10px\">No ```mermaid``` code block found in the markdown.</p>";
                return;
            }
            blocks.forEach((block, i) => {
                const btn = document.createElement("button");
                btn.className = "tab-button";
                btn.innerText = "Diagram " + (i + 1);
                btn.title = "scroll to zoom, drag to pan";
                btn.onclick = () => activateTab(i);
                tabbar.appendChild(btn);

                const wrap = document.createElement("div");
                wrap.className = "diagram-wrap";
                panels.appendChild(wrap);

                tabs.push({ block, btn, wrap, panZoom: null });
            });
            activateTab(0);
        }

        //process searchparams and get string
        async function main() {
            const url = new URL(document.location);
            let text = "";
            if (url.searchParams.has("str")) {
                text = url.searchParams.get("str"); //the param str shouldn't be too long
            } else {
                let md = url.searchParams.get("md");
                if (!md) {
                    md = "test.md";
                } else if (!md.endsWith(".md")) {
                    md = md + ".md";
                }
                console.log("render markdown:" + md);
                const reqUrl = new URL(md, document.location);
                const req = new Request(reqUrl);
                //need Help: support fetch resources from different site
                const res = await fetch(req);
                text = await res.text();
            }
            const blocks = extractMermaidBlocks(text);
            renderDiagrams(blocks);
        }
        main().catch((e) => {
            document.getElementById("panels").innerHTML =
                '<div class="error">Load error: ' + e.message + "</div>";
            console.error(e);
        });
    </script>
</body>

</html>
